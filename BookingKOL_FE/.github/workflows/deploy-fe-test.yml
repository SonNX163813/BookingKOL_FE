name: Deploy FE (DEMO_BookingKOL)

on:
  push:
    branches: ["DEMO_BookingKOL"]
    paths:
      - "BookingKOL_FE/**"
      - "nginx/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: deploy-fe-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deploy FE (rebuild nginx only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
          script_stop: true
          script: |
            set -euxo pipefail
            cd "${{ secrets.WORKDIR || vars.WORKDIR }}"

            # pull đúng nhánh DEMO_BookingKOL
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git fetch --all --prune
              git checkout DEMO_BookingKOL
              git pull --ff-only
            fi

            docker compose build --pull nginx
            docker compose up -d --no-deps --force-recreate nginx
            docker compose ps nginx
